<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>新加坡执行策划案</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;line-height:1.68}.hero{background:linear-gradient(135deg,#b71c1c,#e53935);color:#fff;text-align:center;padding:28px 18px}.hero h1{font-size:22px;margin:0 0 6px}.wrap{max-width:860px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:16px;margin:10px 0 14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.06)}h1,h2,h3{line-height:1.35;color:#b71c1c}h1{font-size:21px;border-bottom:2px solid #fce4e4;padding-bottom:10px}h2{font-size:17px;margin-top:22px;border-left:4px solid #e53935;padding-left:10px}p{margin:8px 0}.muted{color:#667085;font-size:13px}.pill{display:inline-block;background:#fce4e4;color:#b71c1c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;margin:3px}.table-wrap{overflow-x:auto;border:1px solid #e5e7eb;border-radius:10px;margin:10px 0}table{border-collapse:collapse;min-width:620px;width:100%;font-size:12px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}th{background:#f8fafc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#b71c1c;color:#fff}.secondary{background:#fce4e4;color:#b71c1c}.input-row{display:flex;gap:8px}.input-row input{flex:1;border:1.5px solid #ddd;border-radius:10px;padding:12px}.input-row button{border:0;border-radius:10px;background:#b71c1c;color:#fff;font-weight:800;padding:0 18px}.commission{display:none}.commission.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.item b{display:block;color:#b71c1c}@media(max-width:520px){.grid{grid-template-columns:1fr}table{min-width:560px}.hero h1{font-size:20px}}</style></head><body><div class="hero"><h1>新加坡执行策划案已生成</h1></div><div class="wrap"><div class="card"><div class="muted" id="meta"></div><div><span class="pill">新加坡</span><span class="pill" id="projectPill"></span></div><div class="actions"><button class="btn primary" onclick="window.print()">保存 / 打印 PDF</button><button class="btn secondary" onclick="history.back()">返回上一阶段</button></div><div id="doc"></div></div><div class="card"><h2>佣金明细查看</h2><p class="muted">请输入授权密码后查看佣金明细。</p><div class="input-row"><input id="pwd" type="password" placeholder="请输入密码" inputmode="numeric"><button onclick="checkPwd()">确认</button></div></div><div class="card commission" id="commission"><h2>佣金明细</h2><div class="grid"><div class="item"><b>8万美金</b><span>佣金金额</span></div><div class="item"><b>1个月</b><span>结佣周期</span></div><div class="item"><b>2次</b><span>结佣批次</span></div><div class="item"><b>4万美金</b><span>第一批次</span></div><div class="item"><b>4万美金</b><span>第二批次</span></div><div class="item"><b>张三</b><span>对接人</span></div><div class="item"><b>12345678911</b><span>联系方式</span></div></div></div></div><script>function q(k){return new URL(location.href).searchParams.get(k)||''}var names={'sg-fo-13o':'新加坡家族办公室13O','sg-fo-13u':'新加坡家族办公室13U','sg-ep-pr':'EP就业准证→PR','sg-techpass-pr':'Tech.Pass→PR','sg-gip-a':'GIP方案A投资企业','sg-gip-b':'GIP方案B投资基金','sg-gip-c':'GIP方案C家族办公室'};function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function mdToHtml(md){var lines=md.split('\n'),html='',table=[];function closeT(){if(!table.length)return;html+='<div class="table-wrap"><table>';table.forEach(function(r,i){var cs=r.split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1)return;html+='<tr>'+cs.map(function(c){return (i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')}).join('')+'</tr>'});html+='</table></div>';table=[]}lines.forEach(function(l){if(/^\|.*\|$/.test(l)){table.push(l);return}closeT();if(/^# /.test(l))html+='<h1>'+esc(l.slice(2))+'</h1>';else if(/^## /.test(l))html+='<h2>'+esc(l.slice(3))+'</h2>';else if(l.trim())html+='<p>'+esc(l)+'</p>'});closeT();return html}function build(){var issue=q('issue')||'16',sol=q('solution')||'A',proj=q('project')||'sg-fo-13o',name=names[proj]||proj;document.getElementById('meta').textContent='来源：Issue #'+issue+' · 方案 '+sol;document.getElementById('projectPill').textContent=name;var md='# 新加坡全球规划执行策划案\n\n> 文档版本：客户交付版 V1.0\n> 项目：'+name+'\n\n## 摘要结论\n\n本方案建议以“'+name+'”作为新加坡阶段执行路径。新加坡适合作为资产管理、税务优化、子女教育、企业国际化和长期身份规划中心，但必须区分工作准证、永久居民和公民身份的不同阶段。\n\n## 一、客户家庭基本信息\n\n| 项目 | 当前判断 |\n|---|---|\n| 目标国家 | 新加坡 |\n| 推荐项目 | '+name+' |\n| 核心目标 | 资产配置、税务优化、子女教育、身份规划 |\n\n## 二、核心策略\n\n- 事业国：保留中国企业经营，同时评估新加坡控股、家族办公室或雇佣路径。\n- 居住国：可阶段性以新加坡作为教育与生活中心。\n- 福利国：新加坡PR后可逐步享受教育、医疗和长期居住权益。\n\n## 三、项目路径规划\n\n| 路径 | 核心门槛 | 结果 |\n|---|---|---|\n| GIP | S$1,000万/S$2,500万/S$2亿AUM | 直接PR |\n| EP | 薪资门槛+COMPASS≥40 | 先工作准证后PR |\n| Tech.Pass | 3选2科技条件 | 2年准证后PR |\n| 家族办公室13O/13U | AUM S$2,000万/S$5,000万 | 税务豁免+EP/PR路径 |\n\n## 四、执行时间轴\n\n客户信息确认 → 资金来源体检 → 新加坡路径选择 → 材料准备 → 递交EP/GIP/家办申请 → 获批准证/PR → 后续PR/公民规划。\n\n## 五、重要风险声明\n\n新加坡不承认双重国籍；申请公民需放弃原国籍。EP、Tech.Pass、家族办公室和GIP审批均以MOM/EDB/ICA最终口径为准。本方案不构成法律、税务或投资建议。\n\n## 六、法律依据\n\n- EDB Global Investor Programme\n- MOM Employment Pass / COMPASS\n- MOM Tech.Pass\n- MAS 13O/13U 税务豁免框架\n- ICA Permanent Residence / Citizenship\n';document.getElementById('doc').innerHTML=mdToHtml(md)}function checkPwd(){if(document.getElementById('pwd').value==='888888'){document.getElementById('commission').classList.add('show');document.getElementById('commission').scrollIntoView({behavior:'smooth'});}else{alert('密码错误')}}build();</script></body></html>
